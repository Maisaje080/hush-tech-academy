services:
  - type: web
    name: hush-tech-academy
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install gunicorn
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: HUSH_TECH_SECRET_KEY
        generateValue: true
      - key: HUSH_TECH_HTTPS
        value: "1"
